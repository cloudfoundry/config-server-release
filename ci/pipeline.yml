---
jobs:
  - name: lint
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            trigger: true
          - get: golang-image
      - task: golangci-lint
        file: config-server-ci/ci/tasks/lint.yml
        image: golang-image

  - name: test-unit
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            trigger: true
          - get: golang-image
          - get: ruby-image
      - in_parallel:
          - task: test-unit
            file: config-server-ci/ci/tasks/test-unit.yml
            image: golang-image
          - task: test-templates
            file: config-server-ci/ci/tasks/test-templates.yml
            image: ruby-image

  - name: build
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            passed:
              - lint
              - test-unit
            trigger: true
          - get: golang-image
      - task: build-linux
        file: config-server-ci/ci/tasks/build.yml
        image: golang-image
        params:
          GOOS: linux
          GOARCH: amd64

  - name: test-integration
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            passed:
              - lint
              - test-unit
            trigger: true
          - get: bosh-integration-image
          - get: bosh-integration-postgres-15-image
          - get: bosh-integration-mysql-8-0-image
      - in_parallel:
          - task: test-integration-in-memory
            image: bosh-integration-image
            file: config-server-ci/ci/tasks/test-integration.yml
            privileged: true
            params:
              DB: memory
          - task: test-integration-mysql
            image: bosh-integration-mysql-8-0-image
            file: config-server-ci/ci/tasks/test-integration.yml
            privileged: true
            params:
              DB: mysql
          - task: test-integration-postgresql
            image: bosh-integration-postgres-15-image
            file: config-server-ci/ci/tasks/test-integration.yml
            privileged: true
            params:
              DB: postgresql
              DB_VERSION: 15

  - name: test-release
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            passed:
              - build
              - test-integration
            trigger: true
          - get: docker-cpi-image
          - get: stemcell
            resource: ubuntu-noble-stemcell
      - task: test-release
        file: config-server-ci/ci/tasks/test-release.yml
        image: docker-cpi-image
        privileged: true
        params:
          STEMCELL_OS: ubuntu-noble

  - name: automatically-release-new-patch
    serial_groups: [version]
    plan:
      - in_parallel:
          - get: config-server
            passed: [test-release]
            trigger: true
          - get: current-version
            resource: release-version-semver
          - get: patched-version
            resource: release-version-semver
            params:
              bump: patch
          - get: bosh-security-scanner-image
          - get: bosh-shared-ci
          - get: release-notes-branch
            resource: release-notes
      - try:
          task: check-for-patched-cves
          file: bosh-shared-ci/tasks/release/check-for-patched-cves.yml
          image: bosh-security-scanner-image
          input_mapping:
            input_repo: config-server
            version: current-version
          params:
            SEVERITY: CRITICAL,HIGH
          on_success:
            do:
              - task: commit-release-notes
                config:
                  platform: linux
                  image_resource:
                    type: registry-image
                    source:
                      repository: alpine/git
                      username: ((dockerhub_username))
                      password: ((dockerhub_password))
                  inputs:
                    - name: release-notes
                    - name: release-notes-branch
                  outputs:
                    - name: committed-release-notes
                  run:
                    path: sh
                    args:
                      - -c
                      - |
                        cp -r release-notes-branch/. committed-release-notes/
                        cp release-notes/release-notes.md committed-release-notes/release-notes.md
                        cd committed-release-notes
                        git config user.email "bots@cloudfoundry.org"
                        git config user.name "CI Bot"
                        git add release-notes.md
                        git diff --cached --quiet || git commit -m "Update release notes"
              - put: release-notes
                params:
                  repository: committed-release-notes
                  rebase: true
              - put: release-version-semver
                params:
                  file: patched-version/version
      - task: ensure-cve-checker-succeeded
        file: bosh-shared-ci/tasks/release/ensure-task-succeeded.yml
        image: bosh-security-scanner-image
        input_mapping:
          task-output-folder: patched_cves
      - try:
          task: check-for-updated-vendored-packages
          file: bosh-shared-ci/tasks/release/check-for-updated-vendored-packages.yml
          image: bosh-security-scanner-image
          input_mapping:
            input_repo: config-server
            version: current-version
          params:
            PACKAGES: '["golang-1-linux"]'
          on_success:
            do:
              - task: commit-release-notes
                config:
                  platform: linux
                  image_resource:
                    type: registry-image
                    source:
                      repository: alpine/git
                      username: ((dockerhub_username))
                      password: ((dockerhub_password))
                  inputs:
                    - name: release-notes
                    - name: release-notes-branch
                  outputs:
                    - name: committed-release-notes
                  run:
                    path: sh
                    args:
                      - -c
                      - |
                        cp -r release-notes-branch/. committed-release-notes/
                        cp release-notes/release-notes.md committed-release-notes/release-notes.md
                        cd committed-release-notes
                        git config user.email "bots@cloudfoundry.org"
                        git config user.name "CI Bot"
                        git add release-notes.md
                        git diff --cached --quiet || git commit -m "Update release notes"
              - put: release-notes
                params:
                  repository: committed-release-notes
                  rebase: true
              - put: release-version-semver
                params:
                  file: patched-version/version
      - task: ensure-update-package-check-succeeded
        file: bosh-shared-ci/tasks/release/ensure-task-succeeded.yml
        image: bosh-security-scanner-image
        input_mapping:
          task-output-folder: package-updates

  - name: promote-candidate
    disable_manual_trigger: true
    serial_groups: [version]
    plan:
      - in_parallel:
          - get: config-server
            passed: [test-release]
          - get: release-version-semver
            trigger: true
          - get: release-notes
          - get: bosh-shared-ci
          - get: bosh-cli-image
      - task: create-final-release
        file: bosh-shared-ci/tasks/release/create-final-release.yml
        image: bosh-cli-image
        input_mapping:
          release_repo: config-server
          version: release-version-semver
        params:
          GIT_USER_NAME: CI Bot
          GIT_USER_EMAIL: bots@cloudfoundry.org
          PRIVATE_YML: |
            ---
            blobstore:
              options:
                credentials_source: static
                json_key: '((gcp_json_key))'
      - put: config-server
        params:
          repository: release_repo
          rebase: true
          tag: release_metadata/tag-name
      - put: config-server-github-release
        params:
          name: release_metadata/version
          tag: release_metadata/version
          commitish: release_repo/.git/ref
          body: release-notes/release-notes.md
          generate_release_notes: true
      - task: clear-release-notes
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine/git
              username: ((dockerhub_username))
              password: ((dockerhub_password))
          inputs:
            - name: release-notes
          outputs:
            - name: cleared-release-notes
          run:
            path: sh
            args:
              - -c
              - |
                cp -r release-notes/. cleared-release-notes/
                cd cleared-release-notes
                > release-notes.md
                git config user.email "bots@cloudfoundry.org"
                git config user.name "CI Bot"
                git add release-notes.md
                git diff --cached --quiet || git commit -m "Clear release notes after release"
      - put: release-notes
        params:
          repository: cleared-release-notes
          rebase: true

  - name: release-new-major
    serial_groups: [version]
    plan:
      - put: release-version-semver
        params:
          bump: major

  - name: release-new-minor
    serial_groups: [version]
    plan:
      - put: release-version-semver
        params:
          bump: minor

  - name: release-new-patch
    serial_groups: [version]
    plan:
      - put: release-version-semver
        params:
          bump: patch

  - name: bump-deps
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
          - get: golang-release
          - get: golang-image
          - get: bosh-integration-image
          - get: weekly
            trigger: true
      - task: bump-deps
        file: golang-release/ci/tasks/shared/bump-deps.yml
        params:
          SOURCE_PATH: src/config-server/
        input_mapping:
          input_repo: config-server
        output_mapping:
          output_repo: bumped-config-server
      - in_parallel:
          - task: golangci-lint
            file: config-server-ci/ci/tasks/lint.yml
            image: golang-image
            input_mapping:
              config-server: bumped-config-server
          - task: test-unit
            file: config-server-ci/ci/tasks/test-unit.yml
            image: golang-image
            input_mapping:
              config-server: bumped-config-server
          - task: test-integration-in-memory
            file: config-server-ci/ci/tasks/test-integration.yml
            image: bosh-integration-image
            privileged: true
            params:
              DB: memory
            input_mapping:
              config-server: bumped-config-server
      - put: config-server
        params:
          repository: bumped-config-server
          rebase: true

  - name: bump-golang-packages
    plan:
      - in_parallel:
          - get: config-server
          - get: golang-release
            trigger: true
      - task: bump-golang-packages
        file: golang-release/ci/tasks/shared/bump-golang-package.yml
        input_mapping:
          input_repo: config-server
        output_mapping:
          output_repo: bumped-config-server
        params:
          PACKAGES: '["golang-1-linux"]'
          PRIVATE_YML: |
            blobstore:
              options:
                credentials_source: static
                json_key: '((gcp_json_key))'
      - put: config-server
        params:
          repository: bumped-config-server
          rebase: true

resources:
  - name: bosh-integration-postgres-15-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/main-postgres-15
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: bosh-integration-mysql-8-0-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/main-mysql-8.0
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: bosh-integration-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/integration
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: golang-image
    type: registry-image
    source:
      repository: golang
      tag: latest
      username: ((dockerhub_username))
      password: ((dockerhub_password))

  - name: ruby-image
    type: registry-image
    source:
      repository: ruby
      username: ((dockerhub_username))
      password: ((dockerhub_password))

  - name: config-server
    type: git
    source:
      uri: git@github.com:cloudfoundry/config-server-release.git
      branch: main
      private_key: ((github_deploy_key_config-server.private_key))
      ignore_paths:
        - ci

  - name: config-server-ci
    type: git
    source:
      uri: git@github.com:cloudfoundry/config-server-release.git
      branch: main
      private_key: ((github_deploy_key_config-server.private_key))
      paths:
        - ci

  - name: golang-release
    type: git
    source:
      uri: https://github.com/cloudfoundry/bosh-package-golang-release.git

  - name: weekly
    type: time
    source:
      initial_version: true
      start: 3:00 -0700
      stop: 4:30 -0700
      days: [ Saturday ]

  - name: docker-cpi-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/docker-cpi
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: ubuntu-noble-stemcell
    type: bosh-io-stemcell
    source:
      name: bosh-warden-boshlite-ubuntu-noble

  - name: bosh-shared-ci
    type: git
    source:
      uri: https://github.com/cloudfoundry/bosh-shared-ci.git

  - name: bosh-cli-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/cli
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: bosh-security-scanner-image
    type: registry-image
    source:
      repository: bosh/security-scanner
      username: ((dockerhub_username))
      password: ((dockerhub_password))

  - name: release-version-semver
    type: semver
    source:
      initial_version: "0.1.27"
      driver: git
      uri: git@github.com:cloudfoundry/config-server-release.git
      branch: release-details
      file: release-version
      private_key: ((github_deploy_key_config-server.private_key))

  - name: release-notes
    type: git
    source:
      uri: git@github.com:cloudfoundry/config-server-release.git
      branch: release-details
      private_key: ((github_deploy_key_config-server.private_key))
      paths:
        - release-notes.md

  - name: config-server-github-release
    type: github-release
    source:
      owner: cloudfoundry
      repository: config-server-release
      access_token: ((github_public_repo_token))

resource_types:
  - name: bosh-io-stemcell
    type: registry-image
    source:
      repository: foundationalinfrastructure/bosh-io-stemcell-resource
      tag: v1.2.1
