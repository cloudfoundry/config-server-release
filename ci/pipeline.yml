---
jobs:
  - name: lint
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            trigger: true
          - get: golang-image
      - task: golangci-lint
        file: config-server-ci/ci/tasks/lint.yml
        image: golang-image

  - name: test-unit
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            trigger: true
          - get: golang-image
          - get: ruby-image
      - in_parallel:
          - task: test-unit
            file: config-server-ci/ci/tasks/test-unit.yml
            image: golang-image
          - task: test-templates
            file: config-server-ci/ci/tasks/test-templates.yml
            image: ruby-image

  - name: build
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            passed:
              - lint
              - test-unit
            trigger: true
          - get: golang-image
      - task: build-linux
        file: config-server-ci/ci/tasks/build.yml
        image: golang-image
        params:
          GOOS: linux
          GOARCH: amd64

  - name: test-integration
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            passed:
              - build
            trigger: true
          - get: bosh-integration-image
          - get: bosh-integration-postgres-15-image
          - get: bosh-integration-mysql-8-0-image
      - in_parallel:
          - task: test-integration-in-memory
            image: bosh-integration-image
            file: config-server-ci/ci/tasks/test-integration.yml
            privileged: true
            params:
              DB: memory
          - task: test-integration-mysql
            image: bosh-integration-mysql-8-0-image
            file: config-server-ci/ci/tasks/test-integration.yml
            privileged: true
            params:
              DB: mysql
          - task: test-integration-postgresql
            image: bosh-integration-postgres-15-image
            file: config-server-ci/ci/tasks/test-integration.yml
            privileged: true
            params:
              DB: postgresql
              DB_VERSION: 15

  - name: test-release
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            passed:
              - test-integration
            trigger: true
          - get: docker-cpi-image
          - get: stemcell
            resource: ubuntu-noble-stemcell
      - task: test-release
        file: config-server-ci/ci/tasks/test-release.yml
        image: docker-cpi-image
        privileged: true
        params:
          STEMCELL_OS: ubuntu-noble

  - name: placeholder-create-release
    public: true
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
            passed:
              - test-release
          - get: bosh-integration-image
      - task: create-release
        image: bosh-integration-image
        config:
          platform: linux
          inputs:
            - name: config-server
          run:
            path: bash
            args:
              - -euo
              - pipefail
              - -c
              - |
                echo "Nothing to see here"

  - name: bump-deps
    plan:
      - in_parallel:
          - get: config-server-ci
          - get: config-server
          - get: golang-release
          - get: golang-image
          - get: bosh-integration-image
          - get: weekly
            trigger: true
      - task: bump-deps
        file: golang-release/ci/tasks/shared/bump-deps.yml
        params:
          SOURCE_PATH: src/github.com/cloudfoundry/config-server/
        input_mapping:
          input_repo: config-server
        output_mapping:
          output_repo: bumped-config-server
      - in_parallel:
          - task: golangci-lint
            file: config-server-ci/ci/tasks/lint.yml
            image: golang-image
            input_mapping:
              config-server: bumped-config-server
          - task: test-unit
            file: config-server-ci/ci/tasks/test-unit.yml
            image: golang-image
            input_mapping:
              config-server: bumped-config-server
          - task: test-integration-in-memory
            file: config-server-ci/ci/tasks/test-integration.yml
            image: bosh-integration-image
            privileged: true
            params:
              DB: memory
            input_mapping:
              config-server: bumped-config-server
      - put: config-server
        params:
          repository: bumped-config-server
          rebase: true

  - name: bump-golang-packages
    plan:
      - in_parallel:
          - get: config-server
          - get: golang-release
            trigger: true
      - task: bump-golang-packages
        file: golang-release/ci/tasks/shared/bump-golang-package.yml
        input_mapping:
          input_repo: config-server
        output_mapping:
          output_repo: bumped-config-server
        params:
          PACKAGES: '["golang-1-linux"]'
          PRIVATE_YML: |
            blobstore:
              options:
                credentials_source: static
                json_key: '((gcp_json_key))'
      - put: config-server
        params:
          repository: bumped-config-server
          rebase: true

resources:
  - name: bosh-integration-postgres-15-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/main-postgres-15
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: bosh-integration-mysql-8-0-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/main-mysql-8.0
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: bosh-integration-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/integration
      tag: main
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: golang-image
    type: registry-image
    source:
      repository: golang
      tag: latest
      username: ((dockerhub_username))
      password: ((dockerhub_password))

  - name: ruby-image
    type: registry-image
    source:
      repository: ruby
      username: ((dockerhub_username))
      password: ((dockerhub_password))

  - name: config-server
    type: git
    source:
      uri: git@github.com:cloudfoundry/config-server-release.git
      branch: main
      private_key: ((github_deploy_key_config-server.private_key))
      ignore_paths:
        - ci

  - name: config-server-ci
    type: git
    source:
      uri: git@github.com:cloudfoundry/config-server-release.git
      branch: main
      private_key: ((github_deploy_key_config-server.private_key))
      paths:
        - ci

  - name: golang-release
    type: git
    source:
      uri: https://github.com/cloudfoundry/bosh-package-golang-release.git

  - name: weekly
    type: time
    source:
      initial_version: true
      start: 3:00 -0700
      stop: 4:30 -0700
      days: [ Saturday ]

  - name: docker-cpi-image
    type: registry-image
    source:
      repository: ghcr.io/cloudfoundry/bosh/docker-cpi
      username: ((github_read_write_packages.username))
      password: ((github_read_write_packages.password))

  - name: ubuntu-noble-stemcell
    type: bosh-io-stemcell
    source:
      name: bosh-warden-boshlite-ubuntu-noble

resource_types:
  - name: bosh-io-stemcell
    type: registry-image
    source:
      repository: foundationalinfrastructure/bosh-io-stemcell-resource
      tag: v1.2.1
