---
name: config-server-test

releases:
- name: config-server
  version: latest
- name: bpm
  version: latest

stemcells:
- alias: default
  os: ((stemcell_os))
  version: latest

update:
  canaries: 1
  canary_watch_time: 30000-300000
  max_in_flight: 1
  update_watch_time: 30000-300000

instance_groups:
- name: config-server
  azs: [z1]
  instances: 1
  vm_type: default
  stemcell: default
  networks:
  - name: default
  jobs:
  - name: bpm
    release: bpm
  - name: config_server
    release: config-server
    properties:
      port: 8080
      store: memory
      jwt:
        verification_key: ((config_server_jwt_key.public_key))
      ca:
        certificate: ((config_server_ca.certificate))
        private_key: ((config_server_ca.private_key))
      ssl:
        certificate: ((config_server_tls.certificate))
        private_key: ((config_server_tls.private_key))

variables:
- name: config_server_jwt_key
  type: rsa
- name: config_server_ca
  type: certificate
  options:
    is_ca: true
    common_name: config-server-ca
- name: config_server_tls
  type: certificate
  options:
    ca: config_server_ca
    common_name: config-server
    alternative_names:
    - config-server
